name: Run Analysis

on:
  repository_dispatch:
    types: [stockdata-update]
  workflow_dispatch:

jobs:
  analyze_data:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pandas numpy openpyxl matplotlib seaborn lxml baostock plotly kaleido Pillow xlsxwriter

    - name: Download Artifact from Stockdata
      id: download_artifact
      if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        workflow: daily_data_generation.yml
        name: stock-kline-data
        repo: cjbcmp/Stockdata
        run_id: ${{ github.event.client_payload.run_id }}
        if_no_artifact_found: warn

    - name: Fallback to Latest Data from Release
      if: steps.download_artifact.outcome != 'success'
      uses: dsaltares/fetch-gh-release-asset@master
      with:
        repo: 'cjbcmp/Stockdata'
        version: 'tags/latest-data'
        file: 'stock_kline_data.xlsx'
        target: 'stock_kline_data.xlsx'
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Run analysis script
      run: python Passive-Analysis.py

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: analysis-results
        path: |
           *.xlsx
           *.jpg
           K_line_charts/
          - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          # SMTP 服务器配置 (以 163 邮箱为例)
          server_address: smtp.163.com
          server_port: 465
          # 您的发件人邮箱账号 (请在 GitHub Secrets 中设置 MAIL_USERNAME)
          username: ${{secrets.MAIL_USERNAME}}
          # 您的发件人邮箱授权码 (请在 GitHub Secrets 中设置 MAIL_PASSWORD)
          password: ${{secrets.MAIL_PASSWORD}}
          # 邮件主题
          subject: 股票低波动率分析结果 - ${{ github.run_id }}
          # 收件人邮箱
          to: cjbcmp@163.com
          # 发件人显示名称
          from: GitHub Actions Analysis
          # 邮件正文
          body: |
            您好，
            
            Passive-Analysis 自动化分析任务已完成。
            附件包含生成的 low_volatility_stocks.xlsx 文件及所有图表 (.jpg)。
            
            任务 ID: ${{ github.run_id }}
            运行状态: 成功
          # 附件列表：包含指定的 xlsx 和所有 jpg 图片
          attachments: low_volatility_stocks.xlsx,*.jpg
      continue-on-error: true
