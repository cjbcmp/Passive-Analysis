name: Run Stock Analysis

on:
  repository_dispatch:
    types: [stockdata-update]
  workflow_dispatch:

jobs:
  analyze_data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install baostock pandas numpy plotly openpyxl kaleido Pillow xlsxwriter

    - name: Download stock k-line data from artifact
      if: github.event_name == 'repository_dispatch'
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: 'Daily Data Generation and Dispatch'
        workflow_conclusion: success
        name: stock-kline-data
        path: .
        repo: cjbcmp/Stockdata
        run_id: ${{ github.event.client_payload.run_id }}

    - name: Download stock_kline_data from release
      if: github.event_name == 'workflow_dispatch'
      uses: dsaltares/fetch-gh-release-asset@master
      with:
        repo: 'cjbcmp/Stockdata'
        version: 'latest'
        file: 'stock_kline_data.xlsx'
        target: 'stock_kline_data.xlsx'
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Run stock analysis
      run: python Passive-Analysis.py

    - name: Upload generated stock charts
      uses: actions/upload-artifact@v4
      with:
        name: generated-stock-charts
        path: K_line_charts/

    - name: Upload low volatility stocks list
      uses: actions/upload-artifact@v4
      with:
        name: low-volatility-stocks-list
        path: low_volatility_stocks.xlsx

    - name: Upload low volatility stocks image
      uses: actions/upload-artifact@v4
      with:
        name: low-volatility-stocks-image
        path: low_volatility_stocks.jpg

    - name: Upload low volatility stocks image (prefixed)
      uses: actions/upload-artifact@v4
      with:
        name: low-volatility-stocks-image-prefixed
        path: low_volatility_stocks_prefixed.jpg
        
    - name: Send mail
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.163.com
        server_port: 465
        username: cjbcmp@163.com
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: Stock Analysis Report
        body: Attached are the results of the stock analysis.
        to: cjbcmp@163.com
        from: cjbcmp@163.com
        attachments: low_volatility_stocks.xlsx,low_volatility_stocks.jpg,low_volatility_stocks_prefixed.jpg
